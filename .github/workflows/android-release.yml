name: Android Release

# Runs ONLY for version tags like v1.0.0, v1.1.0, v2.0.0.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # required to create a GitHub Release

jobs:
  release:
    name: Test, build & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Decode the base64 keystore secret into a temp file for release signing.
      # The secret is piped through env (never echoed) and the file lives only
      # under $RUNNER_TEMP; it is deleted by the cleanup step below.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumacalendar.keystore"

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build all ABI-split release APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/lumacalendar.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease -PabiSplits --stacktrace

      - name: Create GitHub Release and attach APKs
        uses: softprops/action-gh-release@v2
        with:
          name: Luma Calendar ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/*universal*.apk
            app/build/outputs/apk/release/*arm64-v8a*.apk
            app/build/outputs/apk/release/*armeabi-v7a*.apk
            app/build/outputs/apk/release/*x86_64*.apk
            app/build/outputs/apk/release/*_x86.apk
            app/build/outputs/apk/release/*-x86-release.apk

      # Remove the decoded keystore even if a previous step failed.
      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/lumacalendar.keystore"
